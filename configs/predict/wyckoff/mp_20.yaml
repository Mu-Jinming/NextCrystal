# path: configs/predict/wyckoff/mp_20.yaml
model_path: ${oc.env:NEXTCRYSTAL_ROOT,.}/artifacts/mp_20/wyckoff.ckpt
wyckoff_template_path: ${oc.env:NEXTCRYSTAL_ROOT,.}/data/wyckoff_template.json

input_csv: ${oc.env:NEXTCRYSTAL_ROOT,.}/outputs/mp_20/sg_topk_expanded.csv
output_csv: ${oc.env:NEXTCRYSTAL_ROOT,.}/outputs/mp_20/wyckoff_predictions_from_top5_sg.csv

formula_column: pretty_formula
natoms_column: NAtoms
sg_symbol_column: Spacegroup Symbol
sg_number_column: Spacegroup Number
wyckoff_column: Wyckoff Positions

top_n: 6
max_atoms: 512
max_multiplicities: 30
batch_size: 64
# Portable default for containers and restricted HPC login nodes. Increase this
# locally when multiprocessing data loading is available.
num_workers: 0
use_data_parallel: false

d_model: 256
nhead: 8
num_layers: 6
dim_feedforward: 512
dropout: 0.1

use_moe: true
moe_layers: all
num_experts: 8
capacity_factor: 1.5
router_noisy_std: 0.5
moe_loss_coef: 0.002
moe_top_k: 2
