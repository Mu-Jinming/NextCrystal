[project]
name = "nextcrystal"
version = "0.1.0"
description = "Composition-to-symmetry crystal structure generation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch>=2.4,<2.5",
  "lightning>=2.4,<2.5",
  "pytorch-lightning>=2.4,<2.5",
  "hydra-core>=1.3,<1.4",
  "omegaconf>=2.3,<2.4",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.4,<2",
  "torchmetrics>=1.3,<2",
  "tqdm>=4.66,<5",
  "wandb>=0.16,<1",
]

[project.optional-dependencies]
nextdiff = [
  "einops>=0.7",
  "networkx>=3",
  "p-tqdm>=1.4",
  "pathos>=0.3",
  "pymatgen>=2024.4",
  "python-dotenv>=1",
  "pyxtal>=0.6.7",
  "torch-geometric>=2.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
